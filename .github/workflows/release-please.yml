# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# A repo that publishes something adds its own job here, gated on
# `needs.release-please.outputs.release-created`.
name: Release Please

on:
  push:
    branches:
      - main

jobs:
  release-please:
    name: Release Please
    permissions:
      contents: write
      pull-requests: write
    uses: kirchDev/workflows/.github/workflows/_release-please.yml@7fd4eaf529500fcd07c527ae70c839ab9ac7d76f # v0.7.0
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
