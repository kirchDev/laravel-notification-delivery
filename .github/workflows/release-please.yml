# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# A Packagist package: the tag is what Composer resolves, so nothing is
# published from here.
name: Release Please

on:
  push:
    branches:
      - main

jobs:
  release-please:
    name: Release Please
    permissions:
      contents: write
      pull-requests: write
    uses: kirchDev/workflows/.github/workflows/_release-please.yml@7618b49cd440bf42142d4f524c0ffb1286a92863 # v0.19.2
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
